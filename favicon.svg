<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="chronoArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Machined Plate -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#08080A" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" />

  <!-- Subtle Dial Calibration Track -->
  <circle cx="32" cy="32" r="24" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" stroke-dasharray="2 4" />

  <!-- Chrono-D Monogram: Precision Vertical Pillar (Titanium Platinum) -->
  <line x1="22" y1="17" x2="22" y2="47" stroke="#F4F4F5" stroke-width="5.5" stroke-linecap="round" />

  <!-- Chrono-D Monogram: Celestial Orbital Arc (Signal Cobalt) -->
  <path d="M22 17 H33 C42.5 17 48.5 23.5 48.5 32 C48.5 40.5 42.5 47 33 47 H22" stroke="url(#chronoArc)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Chronometer Pivot -->
  <circle cx="33" cy="32" r="2.5" fill="#F4F4F5" />
</svg>
