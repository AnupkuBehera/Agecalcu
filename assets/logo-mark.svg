<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Obsidian Machined Plate Radial Gradient -->
    <radialGradient id="obsidianBase" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#18181E" />
      <stop offset="50%" stop-color="#0E0F14" />
      <stop offset="100%" stop-color="#060709" />
    </radialGradient>

    <!-- Signal Cobalt Metallic Gradient -->
    <linearGradient id="cobaltArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Chamfer Edge Reflection -->
    <linearGradient id="metallicChamfer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.28)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Squircle Base -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#obsidianBase)" stroke="url(#metallicChamfer)" stroke-width="1.5" />

  <!-- Outer Tachymeter Dial Track -->
  <circle cx="60" cy="60" r="46" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
  <circle cx="60" cy="60" r="41" stroke="rgba(255, 255, 255, 0.10)" stroke-width="1.2" stroke-dasharray="3 6" />

  <!-- Cardinal Tick Marks -->
  <line x1="60" y1="16" x2="60" y2="21" stroke="rgba(255, 255, 255, 0.5)" stroke-width="2" stroke-linecap="round" />
  <line x1="60" y1="99" x2="60" y2="104" stroke="rgba(255, 255, 255, 0.5)" stroke-width="2" stroke-linecap="round" />
  <line x1="16" y1="60" x2="21" y2="60" stroke="rgba(255, 255, 255, 0.5)" stroke-width="2" stroke-linecap="round" />
  <line x1="99" y1="60" x2="104" y2="60" stroke="rgba(255, 255, 255, 0.5)" stroke-width="2" stroke-linecap="round" />

  <!-- 30-degree Minor Tachymeter Dots -->
  <circle cx="82" cy="22" r="1.2" fill="rgba(255, 255, 255, 0.25)" />
  <circle cx="98" cy="38" r="1.2" fill="rgba(255, 255, 255, 0.25)" />
  <circle cx="98" cy="82" r="1.2" fill="rgba(255, 255, 255, 0.25)" />
  <circle cx="82" cy="98" r="1.2" fill="rgba(255, 255, 255, 0.25)" />
  <circle cx="38" cy="98" r="1.2" fill="rgba(255, 255, 255, 0.25)" />
  <circle cx="22" cy="82" r="1.2" fill="rgba(255, 255, 255, 0.25)" />
  <circle cx="22" cy="38" r="1.2" fill="rgba(255, 255, 255, 0.25)" />
  <circle cx="38" cy="22" r="1.2" fill="rgba(255, 255, 255, 0.25)" />

  <!-- Chrono-D Monogram: Precision Vertical Pillar (Titanium Platinum) -->
  <line x1="42" y1="32" x2="42" y2="88" stroke="#F4F4F5" stroke-width="9.5" stroke-linecap="round" />

  <!-- Chrono-D Monogram: Celestial Orbital Arc (Signal Cobalt) -->
  <path d="M42 32 H62 C78.5 32 88.5 44 88.5 60 C88.5 76 78.5 88 62 88 H42" stroke="url(#cobaltArc)" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Precision Chronometer Pivot -->
  <circle cx="62" cy="60" r="4.5" fill="#F4F4F5" stroke="#1D4ED8" stroke-width="1.5" />
</svg>
